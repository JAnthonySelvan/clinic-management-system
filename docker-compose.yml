version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/clinic_management
      - JWT_SECRET=ProductionClinicSecret2026!
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5000
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
