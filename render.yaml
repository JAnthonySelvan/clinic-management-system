services:
  # Backend Web Service
  - type: web
    name: clinic-management-backend
    env: node
    region: singapore
    plan: free
    buildCommand: npm run install:backend
    startCommand: npm run start:backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false

  # Frontend Static Site
  - type: static
    name: clinic-management-frontend
    buildCommand: npm run install:frontend && npm run build:frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
